title: 'Request for Qualification'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              validate:
                - required
          -
            handle: description
            field:
              buttons:
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - anchor
                - removeformat
              remove_empty_nodes: false
              type: bard
              display: Description
          -
            handle: resources
            field:
              display: Resources
              type: replicator
              sets:
                main:
                  display: Main
                  sets:
                    resource:
                      display: Resource
                      fields:
                        -
                          handle: resource_type
                          field:
                            options:
                              -
                                key: file
                                value: File
                              -
                                key: url
                                value: Url
                            type: select
                            display: 'Resource Type'
                            validate:
                              - required
                        -
                          handle: name
                          field:
                            type: text
                            display: Name
                            validate:
                              - required
                        -
                          handle: file
                          field:
                            container: assets
                            max_files: 1
                            type: assets
                            display: File
                            validate:
                              - sometimes
                              - required
                            if:
                              resource_type: 'equals file'
                        -
                          handle: url
                          field:
                            type: link
                            display: Url
                            validate:
                              - required
                              - sometimes
                            if:
                              resource_type: 'equals url'

